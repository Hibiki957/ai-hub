services:
  hub:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: aihub-workbench:2026-10-21
    init: true
    restart: unless-stopped
    user: '${HUB_UID:?Run deploy/setup.mjs first}:${HUB_GID:?Run deploy/setup.mjs first}'
    environment:
      NODE_ENV: production
      HUB_HOST: 0.0.0.0
      HUB_PORT: '8787'
      HUB_DATA_DIR: /data
      HOME: /data
      HUB_ACCESS_TOKEN_FILE: /run/secrets/hub_access_token
      HUB_ENCRYPTION_KEY_FILE: /run/secrets/hub_encryption_key
      HUB_PAPERCLIP_URL: '${HUB_PAPERCLIP_URL:?Set a container-reachable HTTPS Paperclip origin}'
      HUB_PAPERCLIP_COMPANY_ID: '${HUB_PAPERCLIP_COMPANY_ID:-}'
      HUB_SECURE_COOKIE: 'true'
    ports:
      - '127.0.0.1:${HUB_BIND_PORT:-8787}:8787'
    volumes:
      - type: bind
        source: '${HUB_DATA_PATH:?Run deploy/setup.mjs first}'
        target: /data
    secrets:
      - hub_access_token
      - hub_encryption_key
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
secrets:
  hub_access_token:
    file: '${HUB_ACCESS_TOKEN_PATH:?Run deploy/setup.mjs first}'
  hub_encryption_key:
    file: '${HUB_ENCRYPTION_KEY_PATH:?Run deploy/setup.mjs first}'
