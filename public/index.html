<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Hub</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
<style>
  :root {
    --bg: #faf9f5;
    --panel: #f0eee6;
    --card: #ffffff;
    --border: #e6e4dd;
    --border-strong: #d9d7cf;
    --text: #141413;
    --dim: #6e6b5e;
    --dimmer: #a3a08f;
    --accent: #d97757;
    --accent-soft: rgba(217,119,87,.12);
    --green: #639922;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(0,0,0,.12); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,.22); }

  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ── 顶栏 ── */
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 0 18px; height: 46px; flex-shrink: 0;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }
  .logo {
    width: 20px; height: 20px; border-radius: 5px; flex-shrink: 0;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: #fff;
  }
  header h1 { font-size: 14px; font-weight: 600; letter-spacing: .2px; }
  .badge {
    font-size: 10.5px; color: var(--dim); padding: 2px 9px;
    border: 1px solid var(--border-strong); border-radius: 99px;
    font-family: var(--mono); background: var(--panel);
  }
  .status { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--dim); font-family: var(--mono); }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }

  /* ── 主体 ── */
  main { flex: 1; display: flex; overflow: hidden; }

  aside {
    width: 240px; flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--border);
    overflow-y: auto; padding: 14px 12px;
  }
  aside h2 {
    font-size: 11px; font-weight: 600; color: var(--dimmer);
    letter-spacing: 1px;
    padding: 14px 10px 7px; font-family: var(--mono);
  }
  .item {
    display: flex; align-items: center; gap: 10px;
    width: 100%; text-align: left; background: none;
    border: 1px solid transparent;
    color: var(--text); padding: 7px 10px; font-size: 13px;
    border-radius: 8px; cursor: pointer;
    transition: background .12s ease, border-color .12s ease;
  }
  .item:hover { background: var(--card); border-color: var(--border-strong); }
  .item:active { background: var(--accent-soft); }
  .item .tile {
    width: 22px; height: 22px; border-radius: 5px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700;
    font-family: var(--mono);
  }
  .item .arrow { margin-left: auto; color: var(--dimmer); font-size: 12px; opacity: 0; transition: opacity .12s; }
  .item:hover .arrow { opacity: 1; }

  /* ── 标签页 ── */
  #tabs {
    display: flex; align-items: flex-end; gap: 4px;
    padding: 8px 12px 0; flex-shrink: 0;
    border-bottom: 1px solid var(--border);
    background: var(--panel); overflow-x: auto;
    min-height: 42px;
  }
  #tabs:empty { display: none; }
  .tab {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 13px; font-size: 12.5px;
    background: transparent; color: var(--dim);
    border: 1px solid transparent; border-bottom: none;
    border-radius: 8px 8px 0 0; cursor: pointer;
    animation: fadeIn .15s ease; white-space: nowrap;
    transition: color .12s, background .12s;
  }
  .tab:hover { background: rgba(0,0,0,.03); }
  .tab.active { color: var(--text); background: var(--bg); border-color: var(--border-strong); font-weight: 500; }
  .tab .tdot { width: 7px; height: 7px; border-radius: 50%; }
  .tab .x { opacity: 0; font-size: 11px; padding: 0 2px; color: var(--dimmer); }
  .tab:hover .x { opacity: 1; }
  .tab .x:hover { color: #c13f2e; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

  /* ── 终端区 ── */
  #term-area { flex: 1; position: relative; background: var(--bg); }
  .term-holder { position: absolute; inset: 0; display: none; padding: 10px 6px 6px 14px; }
  .term-holder.active { display: block; }

  #welcome {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; color: var(--dim);
  }
  #welcome .glyph {
    width: 58px; height: 58px; border-radius: 14px;
    background: var(--card);
    border: 1px solid var(--border-strong);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; color: var(--accent);
    box-shadow: 0 2px 8px rgba(0,0,0,.04);
  }
  #welcome .title { font-size: 16px; font-weight: 600; color: var(--text); }
  #welcome .hint { font-size: 12.5px; color: var(--dim); }
  #welcome .hint kbd {
    font-family: var(--mono); font-size: 11px; padding: 2px 7px;
    border: 1px solid var(--border-strong); border-radius: 5px;
    background: var(--card); color: var(--accent);
  }

  /* xterm 浅色适配 */
  .terminal { height: 100%; }
  .xterm .xterm-viewport::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); }
</style>
</head>
<body>
<header>
  <span class="logo">❯</span>
  <h1>AI Hub</h1>
  <span class="badge">127.0.0.1:8787</span>
  <span class="status"><span class="dot"></span>local · ready</span>
</header>
<div id="tabs"></div>
<main>
  <aside id="sidebar"></aside>
  <section id="term-area">
    <div id="welcome">
      <span class="glyph">❯_</span>
      <p class="title">AI Hub</p>
      <p class="hint">左侧选 <kbd>CLI</kbd> 开终端 · <kbd>App</kbd> 唤起 · <kbd>Web</kbd> 直达</p>
    </div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
